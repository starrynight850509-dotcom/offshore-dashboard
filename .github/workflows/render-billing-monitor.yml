name: Render Billing Monitor - Automated Usage Diagnostics

on:
  schedule:
    - cron: '17 1 * * *' # 09:17 Asia/Taipei; GitHub may delay scheduled runs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-billing-monitor
  cancel-in-progress: false

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
    steps:
      - name: Unified Render diagnostics (read only)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RENDER_API_KEY:-}" ]]; then
            echo '::error::Missing GitHub Secret RENDER_API_KEY'; exit 1
          fi
          if [[ ! "${RENDER_SERVICE_ID:-}" =~ ^srv-[a-zA-Z0-9]+$ ]]; then
            echo '::error::Missing or invalid GitHub Variable RENDER_SERVICE_ID'; exit 1
          fi
          python - <<'PY'
          import collections
          import datetime as dt
          import json
          import math
          import os
          import statistics
          import urllib.error
          import urllib.parse
          import urllib.request

          now = dt.datetime.now(dt.timezone.utc)
          start = now - dt.timedelta(hours=24)
          tz = dt.timezone(dt.timedelta(hours=8))
          service_id = os.environ['RENDER_SERVICE_ID']
          headers = {
              'Authorization': 'Bearer ' + os.environ['RENDER_API_KEY'],
              'Accept': 'application/json',
              'User-Agent': 'render-billing-monitor/auto',
          }
          def fetch(url):
              request = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=25) as response:
                      return response.status, json.load(response), None
              except urllib.error.HTTPError as error:
                  return error.code, None, 'HTTP error (body hidden)'
              except Exception as error:
                  return None, None, type(error).__name__
          def parse_time(value):
              try:
                  return dt.datetime.fromisoformat(value.replace('Z', '+00:00')).astimezone(dt.timezone.utc)
              except (AttributeError, ValueError, TypeError):
                  return None
          def label_key(series):
              labels = series.get('labels', [])
              if not isinstance(labels, list):
                  return None
              return tuple(sorted((str(label.get('field', '')), str(label.get('value', '')))
                                  for label in labels if isinstance(label, dict)))

          report = {
              'checked_at_utc': now.isoformat(),
              'window_start_utc': start.isoformat(),
              'window_end_utc': now.isoformat(),
              'service_id': service_id,
              'billing': {
                  'instance_hours': {'status': 'UNAVAILABLE', 'reason': 'No verified Billing Usage API endpoint'},
                  'billing_bandwidth': {'status': 'UNAVAILABLE', 'reason': 'Metrics bandwidth is not verified as billable usage'},
                  'pipeline_minutes': {'status': 'UNAVAILABLE', 'reason': 'No verified Billing Usage API endpoint'},
                  'spend_limit': {'status': 'UNAVAILABLE', 'reason': 'No verified spend-limit read endpoint'},
                  'service_quota': {'status': 'UNAVAILABLE', 'reason': 'Workspace quota not verified by service lookup'},
                  'custom_domains': {'status': 'UNAVAILABLE', 'reason': 'Workspace domain quota not verified'},
              },
              'metrics': {},
          }
          print('=== Render Unified Diagnostics ===')
          print('Taiwan check:', now.astimezone(tz).strftime('%Y-%m-%d %H:%M:%S'))
          print('Service ID:', service_id)
          status, service, error = fetch('https://api.render.com/v1/services/' + service_id)
          report['service_lookup'] = {'http_status': status, 'status': 'PASS' if status == 200 and isinstance(service, dict) else 'ERROR'}
          print('Service lookup:', report['service_lookup']['status'], '| HTTP', status, '|', error or '')
          if report['service_lookup']['status'] != 'PASS':
              raise SystemExit('::error::Service lookup failed; cannot validate target service')

          params = urllib.parse.urlencode({
              'resource': service_id,
              'startTime': start.strftime('%Y-%m-%dT%H:%M:%SZ'),
              'endTime': now.strftime('%Y-%m-%dT%H:%M:%SZ'),
          })
          for name, path in [('bandwidth', 'bandwidth'), ('cpu', 'cpu'),
                             ('memory', 'memory'), ('instance_count', 'instance-count')]:
              status, payload, error = fetch('https://api.render.com/v1/metrics/' + path + '?' + params)
              result = {'http_status': status, 'status': 'ERROR', 'series_count': None}
              if status == 200 and isinstance(payload, list):
                  result['status'] = 'PASS' if payload else 'NO_DATA'
                  result['series_count'] = len(payload)
                  units = collections.Counter()
                  label_fields = collections.Counter()
                  seen = set()
                  duplicates = 0
                  invalid = 0
                  outside = 0
                  points = []
                  for series in payload:
                      if not isinstance(series, dict):
                          invalid += 1
                          continue
                      units[str(series.get('unit'))] += 1
                      labels = label_key(series)
                      if labels is None:
                          invalid += 1
                          continue
                      for field, _ in labels:
                          label_fields[field] += 1
                      values = series.get('values', [])
                      if not isinstance(values, list):
                          invalid += 1
                          continue
                      for point in values:
                          if not isinstance(point, dict):
                              invalid += 1
                              continue
                          timestamp = parse_time(point.get('timestamp'))
                          value = point.get('value')
                          if timestamp is None or isinstance(value, bool) or not isinstance(value, (int, float)) or not math.isfinite(value):
                              invalid += 1
                              continue
                          if not start <= timestamp <= now:
                              outside += 1
                              continue
                          identity = (labels, timestamp)
                          if identity in seen:
                              duplicates += 1
                              continue
                          seen.add(identity)
                          points.append((timestamp, float(value)))
                  result.update({
                      'units': dict(units), 'label_fields': dict(label_fields),
                      'valid_points': len(points), 'invalid_points': invalid,
                      'outside_window': outside, 'duplicate_points': duplicates,
                  })
                  if points:
                      values = [value for _, value in points]
                      latest = max(timestamp for timestamp, _ in points)
                      latest_values = [value for timestamp, value in points if timestamp == latest]
                      result.update({
                          'first_observed_utc': min(timestamp for timestamp, _ in points).isoformat(),
                          'latest_observed_utc': latest.isoformat(),
                          'observation_mean': statistics.mean(values),
                          'observation_max': max(values),
                          'latest_value': latest_values[0] if len(latest_values) == 1 else None,
                      })
              report['metrics'][name] = result
              print(name, ':', result['status'], '| HTTP', status,
                    '| series', result['series_count'], '| points', result.get('valid_points', 0),
                    '| units', result.get('units', {}), '| labels', list(result.get('label_fields', {})))
              if error:
                  print('  Error:', error)

          # Monthly bandwidth-source diagnostic: metrics only, never billed totals.
          month_start = now.replace(day=1, hour=0, minute=0, second=0, microsecond=0)
          monthly_params = urllib.parse.urlencode({
              'resource': service_id,
              'startTime': month_start.strftime('%Y-%m-%dT%H:%M:%SZ'),
              'endTime': now.strftime('%Y-%m-%dT%H:%M:%SZ'),
          })
          status, payload, error = fetch(
              'https://api.render.com/v1/metrics/bandwidth-sources?' + monthly_params
          )
          breakdown = {'status': 'ERROR', 'http_status': status,
                       'window_start_utc': month_start.isoformat(),
                       'window_end_utc': now.isoformat(), 'is_billing_total': False}
          if status == 200:
              breakdown['root_type'] = type(payload).__name__
              if isinstance(payload, list):
                  series = payload
                  breakdown['root_length'] = len(payload)
              elif isinstance(payload, dict):
                  breakdown['response_keys'] = sorted(str(k)[:80] for k in payload.keys())[:30]
                  breakdown['field_types'] = {
                      str(k)[:80]: type(v).__name__
                      for k, v in list(payload.items())[:30]
                  }
                  series = next((payload[k] for k in ('data', 'series', 'results', 'items')
                                 if isinstance(payload.get(k), list)), None)
                  if series is None:
                      breakdown['status'] = 'UNEXPECTED_SHAPE'
              else:
                  series = None
                  breakdown['status'] = 'UNEXPECTED_SHAPE'
              if isinstance(series, list):
                  breakdown['status'] = 'PASS' if series else 'NO_DATA'
                  breakdown['series_count'] = len(series)
                  breakdown['element_types'] = sorted({type(x).__name__ for x in series})
                  sample = next((x for x in series if isinstance(x, dict)), None)
                  if sample is not None:
                      breakdown['sample_keys'] = sorted(str(k)[:80] for k in sample.keys())[:30]
                      breakdown['sample_field_types'] = {
                          str(k)[:80]: type(v).__name__
                          for k, v in list(sample.items())[:30]
                      }
                  breakdown['point_count'] = sum(
                      len(item.get('values', [])) for item in series
                      if isinstance(item, dict) and isinstance(item.get('values'), list)
                  )
                  breakdown['units'] = sorted({
                      str(item.get('unit'))[:30] for item in series
                      if isinstance(item, dict) and item.get('unit') is not None
                  })
          elif status in (401, 403, 404):
              breakdown['status'] = 'UNAVAILABLE'
          if error:
              breakdown['error'] = error
          # Per-series metadata diagnostics. Do not aggregate metric values into billing totals.
          if status == 200 and isinstance(series, list):
              diagnostics = []
              source_groups = collections.defaultdict(set)
              observations_by_source = collections.defaultdict(dict)
              source_timestamp_groups = collections.defaultdict(set)
              for index, item in enumerate(series):
                  info = {'series_index': index, 'status': 'UNEXPECTED_SHAPE'}
                  if not isinstance(item, dict):
                      diagnostics.append(info)
                      continue
                  raw_labels = item.get('labels')
                  info['label_fields'] = sorted({
                      str(label.get('field', ''))[:60] for label in raw_labels
                      if isinstance(label, dict)
                  }) if isinstance(raw_labels, list) else []
                  info['label_count'] = len(raw_labels) if isinstance(raw_labels, list) else None
                  # Render's labels are a list of {field, value}; emit only bounded
                  # resource/source labels, never credentials or response bodies.
                  safe_labels = {}
                  if isinstance(raw_labels, list):
                      for label in raw_labels:
                          if not isinstance(label, dict):
                              continue
                          field = label.get('field')
                          value = label.get('value')
                          if field in ('trafficSource', 'resource') and isinstance(value, str):
                              safe_labels[field] = value[:100]
                  info['labels'] = safe_labels
                  source = safe_labels.get('trafficSource', 'MISSING')
                  source_groups[source].add(index)
                  info['unit'] = str(item.get('unit', ''))[:30]
                  raw_values = item.get('values')
                  if not isinstance(raw_values, list):
                      diagnostics.append(info)
                      continue
                  observations = []
                  invalid = 0
                  for point in raw_values:
                      if not isinstance(point, dict):
                          invalid += 1
                          continue
                      timestamp = parse_time(point.get('timestamp'))
                      value = point.get('value')
                      if (timestamp is None or isinstance(value, bool)
                              or not isinstance(value, (int, float)) or not math.isfinite(value)):
                          invalid += 1
                          continue
                      observations.append((timestamp, float(value)))
                  observations.sort(key=lambda pair: pair[0])
                  if info['unit'] == 'mb' and source in ('total', 'nat', 'http'):
                      for ts, val in observations:
                          observations_by_source[source][ts] = val
                  for timestamp, _ in observations:
                      source_timestamp_groups[timestamp.isoformat()].add(source)
                  times = [t for t, _ in observations]
                  values = [v for _, v in observations]
                  deltas = [(b-a).total_seconds() / 60 for a, b in zip(times, times[1:])]
                  changes = [b-a for a, b in zip(values, values[1:])]
                  info.update({
                      'status': 'PASS' if observations else 'NO_VALID_POINTS',
                      'raw_point_count': len(raw_values),
                      'valid_point_count': len(observations),
                      'invalid_point_count': invalid,
                      'duplicate_timestamp_count': len(times)-len(set(times)),
                      'first_timestamp_utc': times[0].isoformat() if times else None,
                      'last_timestamp_utc': times[-1].isoformat() if times else None,
                      'interval_minutes': {
                          'min': min(deltas), 'max': max(deltas),
                          'most_common': collections.Counter(deltas).most_common(3),
                      } if deltas else None,
                      'values': {
                          'first': values[0], 'last': values[-1],
                          'min': min(values), 'max': max(values),
                          'negative_count': sum(v < 0 for v in values),
                          'increases': sum(d > 0 for d in changes),
                          'decreases': sum(d < 0 for d in changes),
                          'unchanged': sum(d == 0 for d in changes),
                      } if values else None,
                      'aggregation': 'NOT_CALCULATED_UNVERIFIED_METRIC_SEMANTICS',
                  })
                  diagnostics.append(info)
              breakdown['series_diagnostics'] = diagnostics
              breakdown['traffic_sources'] = {
                  source: sorted(indices)
                  for source, indices in sorted(source_groups.items())
              }
              breakdown['timestamps_shared_across_sources'] = sum(
                  len(sources) > 1 for sources in source_timestamp_groups.values()
              )
              # Diagnostic comparison at identical timestamps only.
              total_points = observations_by_source.get('total', {})
              nat_points = observations_by_source.get('nat', {})
              http_points = observations_by_source.get('http', {})
              aligned = sorted(set(total_points) & set(nat_points) & set(http_points))
              diffs = [total_points[t] - nat_points[t] - http_points[t] for t in aligned]
              abs_diffs = [abs(d) for d in diffs]
              tolerance_mb = 0.000001
              breakdown['source_additivity_check'] = {
                  'aligned_timestamp_count': len(aligned),
                  'within_tolerance_count': sum(d <= tolerance_mb for d in abs_diffs),
                  'tolerance_mb': tolerance_mb,
                  'max_absolute_difference_mb': max(abs_diffs) if abs_diffs else None,
                  'mean_absolute_difference_mb': statistics.mean(abs_diffs) if abs_diffs else None,
                  'verified_for_all_timestamps': False,
                  'reason': 'Checks only timestamps present in all three series; API semantics remain unverified',
              }
              # Explicitly experimental: not the Render Billing Usage figure.
              # Compare the total-series sum against the displayed 5 GB quota.
              # 5 GB decimal convention is a provisional assumption, not a verified Render conversion.
              quota_mb = 5000.0
              eligible = (breakdown.get('units') == ['mb']
                          and len(source_groups.get('total', [])) == 1
                          and all(v >= 0 for v in total_points.values())
                          and len(total_points) > 0)
              experimental_sum = sum(total_points.values()) if eligible else None
              breakdown['experimental_bandwidth_goal'] = {
                  'status': 'EXPERIMENTAL' if eligible else 'UNAVAILABLE',
                  'source': 'total',
                  'observed_point_count': len(total_points),
                  'provisional_quota_gb': 5,
                  'provisional_quota_mb': quota_mb,
                  'assumed_conversion': '1 GB = 1000 MB (unverified)',
                  'observed_values_sum_mb': experimental_sum,
                  'provisional_used_percent': round(experimental_sum / quota_mb * 100, 4) if eligible else None,
                  'provisional_remaining_mb': max(0, quota_mb - experimental_sum) if eligible else None,
                  'official_billing_equivalence': 'UNVERIFIED',
                  'time_bucket_semantics': 'UNVERIFIED',
                  'is_billing_total': False,
                  'is_alert_eligible': False,
                  'warning': 'Summed sampled metrics may omit buckets or misrepresent billed bandwidth',
              }
              breakdown['aggregation_assessment'] = {
                  'metric_unit': 'mb' if breakdown.get('units') == ['mb'] else 'MIXED_OR_UNKNOWN',
                  'sample_behavior': 'NON_MONOTONIC_OBSERVATIONS' if any(
                      (entry.get('values') or {}).get('decreases', 0) > 0
                      for entry in diagnostics
                  ) else 'NOT_ESTABLISHED',
                  'time_bucket_semantics': 'UNVERIFIED',
                  'traffic_source_additivity': 'UNVERIFIED',
                  'official_billing_equivalence': 'UNVERIFIED',
                  'monthly_total': None,
                  'reason': 'API series structure and values alone do not establish billable accounting or aggregation semantics',
              }
          report['bandwidth_sources_month_to_date'] = breakdown
          print('\n=== Monthly Bandwidth Sources (NOT Billing) ===')
          print('Status:', breakdown['status'], '| HTTP:', status,
                '| series:', breakdown.get('series_count'),
                '| points:', breakdown.get('point_count'),
                '| units:', breakdown.get('units'))
          print('Structure:', {k: breakdown[k] for k in ('root_type', 'root_length', 'response_keys', 'field_types', 'element_types', 'sample_keys', 'sample_field_types') if k in breakdown})
          print('Traffic sources:', json.dumps(breakdown.get('traffic_sources', {}), ensure_ascii=False, sort_keys=True))
          print('Timestamps shared across sources:', breakdown.get('timestamps_shared_across_sources'))
          print('Source additivity check:', json.dumps(breakdown.get('source_additivity_check', {}), ensure_ascii=False, sort_keys=True))
          print('Experimental bandwidth goal:', json.dumps(breakdown.get('experimental_bandwidth_goal', {}), ensure_ascii=False, sort_keys=True))
          print('Aggregation assessment:', json.dumps(breakdown.get('aggregation_assessment', {}), ensure_ascii=False, sort_keys=True))
          for item in breakdown.get('series_diagnostics', []):
              print('Series diagnostics:', json.dumps(item, ensure_ascii=False, sort_keys=True))

          # Workspace inventory: public API, all pages, no guessing if incomplete.
          # Render lists service resources as {service: {...}, cursor: ...}.
          def paged_items(path, query=None):
              items, cursor, seen = [], None, set()
              for _ in range(100):
                  args = dict(query or {})
                  args['limit'] = 100
                  if cursor:
                      args['cursor'] = cursor
                  url = 'https://api.render.com/v1/' + path + '?' + urllib.parse.urlencode(args)
                  code, data, err = fetch(url)
                  if code != 200 or not isinstance(data, list):
                      return None, {'status': 'ERROR', 'http_status': code, 'reason': err or 'Unexpected response shape'}
                  items.extend(data)
                  if not data:
                      return items, {'status': 'PASS', 'pages_complete': True}
                  next_cursor = data[-1].get('cursor') if isinstance(data[-1], dict) else None
                  if not next_cursor:
                      if len(data) == 100:
                          return None, {'status': 'INCOMPLETE', 'reason': 'Full page without cursor; cannot verify completeness'}
                      return items, {'status': 'PASS', 'pages_complete': True}
                  if next_cursor in seen:
                      return None, {'status': 'INCOMPLETE', 'reason': 'Repeated pagination cursor'}
                  seen.add(next_cursor)
                  cursor = next_cursor
              return None, {'status': 'INCOMPLETE', 'reason': 'Page safety limit reached'}

          owner_id = service.get('ownerId') if isinstance(service, dict) else None
          if not owner_id:
              report['inventory'] = {'status': 'UNAVAILABLE', 'reason': 'Service response has no ownerId; workspace not verified'}
          else:
              entries, scan = paged_items('services', {'ownerId': owner_id, 'includePreviews': 'false'})
              inventory = {'status': scan['status'], 'scope': 'ownerId', 'owner_id': owner_id,
                           'include_previews': False, 'details': scan}
              if entries is not None:
                  services = [e.get('service') for e in entries if isinstance(e, dict) and isinstance(e.get('service'), dict)]
                  if len(services) != len(entries) or any(s.get('ownerId') != owner_id for s in services):
                      inventory['status'] = 'INCOMPLETE'
                      inventory['reason'] = 'Unrecognized service item or owner mismatch'
                  else:
                      inventory['service_count'] = len(services)
                      inventory['service_ids'] = [s['id'] for s in services if isinstance(s.get('id'), str)]
                      inventory['service_quota_reference'] = 25
                      inventory['service_usage_percent_reference'] = round(100 * len(services) / 25, 4)
                      report['billing']['service_quota'] = {
                          'status': 'API_INVENTORY_NOT_BILLING', 'count': len(services),
                          'reference_quota': 25, 'reason': 'All accessible non-preview services in selected workspace; billing count not independently verified'}
                      domain_count, domain_errors = 0, []
                      for s in services:
                          sid = s.get('id')
                          if not sid:
                              domain_errors.append('Missing service ID')
                              continue
                          domains, result = paged_items('services/' + urllib.parse.quote(sid, safe='') + '/custom-domains')
                          if domains is None:
                              domain_errors.append({'service_id': sid, 'status': result['status'], 'http_status': result.get('http_status')})
                          else:
                              domain_count += len(domains)
                      inventory['custom_domains'] = {
                          'status': 'PASS' if not domain_errors else 'INCOMPLETE',
                          'count': domain_count if not domain_errors else None,
                          'reference_quota': 2, 'errors': domain_errors}
                      if not domain_errors:
                          report['billing']['custom_domains'] = {
                              'status': 'API_INVENTORY_NOT_BILLING', 'count': domain_count,
                              'reference_quota': 2, 'reason': 'Count from all accessible non-preview services; billing equivalence unverified'}
              report['inventory'] = inventory
          print('\n=== Workspace Inventory (NOT Billing) ===')
          print(json.dumps(report['inventory'], ensure_ascii=False, sort_keys=True))

          # Other official values cannot be inferred from service uptime or deploy durations.
          # Keep explicit limits and status in one report, without fabricating usage.
          report['billing_targets'] = {
              'instance_hours': {'quota': 750, 'unit': 'hours', 'official_usage': None},
              'bandwidth': {'quota': 5, 'unit': 'GB', 'official_usage': None},
              'pipeline_minutes': {'quota': 500, 'unit': 'minutes', 'official_usage': None},
              'services': {'quota': 25, 'unit': 'services', 'official_usage': None},
              'custom_domains': {'quota': 2, 'unit': 'domains', 'official_usage': None},
          }
          # Automatic evidence collection. Neither endpoint is a billing API.
          month_start = now.replace(day=1, hour=0, minute=0, second=0, microsecond=0)
          month_params = {'startTime': month_start.isoformat().replace('+00:00','Z'),
                          'endTime': now.isoformat().replace('+00:00','Z'),
                          'resolutionSeconds': 3600, 'resource': service_id}
          count_url = 'https://api.render.com/v1/metrics/instance-count?' + urllib.parse.urlencode(month_params)
          count_code, count_data, count_err = fetch(count_url)
          instance_evidence = {'source': 'GET /v1/metrics/instance-count',
                               'status': 'PASS' if count_code == 200 and isinstance(count_data, list) else 'UNAVAILABLE',
                               'http_status': count_code, 'official_billing_usage': None,
                               'note': 'Hourly instance-count samples are NOT billed free instance hours; gaps and spin-down must be verified'}
          if isinstance(count_data, list) and count_code == 200:
              instance_evidence['series_count'] = len(count_data)
              instance_evidence['series'] = []
              for series in count_data:
                  if not isinstance(series, dict):
                      continue
                  vals = series.get('values', [])
                  instance_evidence['series'].append({
                      'labels': series.get('labels', []), 'unit': series.get('unit'),
                      'sample_count': len(vals) if isinstance(vals, list) else None,
                      'sample_first': vals[0] if isinstance(vals, list) and vals else None,
                      'sample_last': vals[-1] if isinstance(vals, list) and vals else None})
          report['instance_hours_evidence'] = instance_evidence
          print('\n=== Instance Hours Automatic Evidence (NOT Billing) ===')
          print(json.dumps(instance_evidence, ensure_ascii=False, sort_keys=True))

          # List deploys across all discovered workspace services; no manual variables.
          deploy_evidence = {'source': 'GET /v1/services/{id}/deploys',
                             'status': 'UNAVAILABLE', 'official_billing_usage': None,
                             'note': 'Deploy elapsed times include non-build stages and may omit other pipeline tasks; not billable minutes',
                             'services': [], 'errors': []}
          ids = report.get('inventory', {}).get('service_ids', [])
          if report.get('inventory', {}).get('status') == 'PASS':
              for sid in ids:
                  entries, scan = paged_items('services/' + urllib.parse.quote(sid, safe='') + '/deploys',
                      {'createdAfter': month_start.isoformat().replace('+00:00','Z')})
                  if entries is None:
                      deploy_evidence['errors'].append({'service_id': sid, 'detail': scan})
                      continue
                  durations, missing, count = [], 0, 0
                  for entry in entries:
                      dep = entry.get('deploy') if isinstance(entry, dict) else None
                      if not isinstance(dep, dict):
                          missing += 1
                          continue
                      count += 1
                      started, finished = parse_time(dep.get('startedAt')), parse_time(dep.get('finishedAt'))
                      if started and finished and finished >= started:
                          durations.append((finished-started).total_seconds()/60)
                      else:
                          missing += 1
                  deploy_evidence['services'].append({
                      'service_id': sid, 'deploy_count': count,
                      'deploys_with_elapsed_time': len(durations),
                      'deploys_missing_elapsed_time': missing,
                      'sum_deploy_elapsed_minutes_NOT_PIPELINE': round(sum(durations), 3)})
              deploy_evidence['status'] = 'PASS' if not deploy_evidence['errors'] else 'INCOMPLETE'
          report['pipeline_minutes_evidence'] = deploy_evidence
          print('\n=== Pipeline Minutes Automatic Evidence (NOT Billing) ===')
          print(json.dumps(deploy_evidence, ensure_ascii=False, sort_keys=True))
          print('Billing targets recorded; quotas are reference limits, not live quota API responses.')

          print('\n=== Billing Usage (official values only) ===')
          for name, item in report['billing'].items():
              print(name, ':', item['status'], '|', item['reason'])
          print('IMPORTANT: Metric values are NOT billed totals. No estimation or substitution.')
          with open('render-diagnostics.json', 'w', encoding='utf-8') as file:
              json.dump(report, file, indent=2, ensure_ascii=False)
          print('Report saved. No database writes. Credentials and API bodies not logged.')
