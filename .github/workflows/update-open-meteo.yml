name: Update F2 Open-Meteo Forecast

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-open-meteo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests psycopg2-binary
      - name: Fetch and save Open-Meteo forecast
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python open_meteo_updater.py
