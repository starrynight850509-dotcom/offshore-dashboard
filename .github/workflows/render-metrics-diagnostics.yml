name: Render Metrics Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
    steps:
      - name: Probe Render metrics (read only)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RENDER_API_KEY:-}" ]]; then
            echo '::error::Missing secret RENDER_API_KEY'; exit 1
          fi
          if [[ ! "${RENDER_SERVICE_ID:-}" =~ ^srv-[a-zA-Z0-9]+$ ]]; then
            echo '::error::Missing or invalid variable RENDER_SERVICE_ID'; exit 1
          fi
          python - <<'PY'
          import datetime, json, os, urllib.parse, urllib.request, urllib.error

          key = os.environ['RENDER_API_KEY']
          service_id = os.environ['RENDER_SERVICE_ID']
          now = datetime.datetime.now(datetime.timezone.utc)
          start = now - datetime.timedelta(hours=24)
          params = urllib.parse.urlencode({
              'resource': service_id,
              'startTime': start.strftime('%Y-%m-%dT%H:%M:%SZ'),
              'endTime': now.strftime('%Y-%m-%dT%H:%M:%SZ'),
          })
          checks = {
              'Service': f'https://api.render.com/v1/services/{service_id}',
              'Bandwidth': f'https://api.render.com/v1/metrics/bandwidth?{params}',
              'CPU': f'https://api.render.com/v1/metrics/cpu?{params}',
              'Memory': f'https://api.render.com/v1/metrics/memory?{params}',
              'Instance Count': f'https://api.render.com/v1/metrics/instance-count?{params}',
          }
          print('Check time (Taiwan):', (now + datetime.timedelta(hours=8)).strftime('%Y-%m-%d %H:%M:%S'))
          print('Service ID:', service_id)
          print('Time range: last 24 hours (UTC)')
          print('No API response bodies or credentials will be printed.')
          results = []
          for label, url in checks.items():
              req = urllib.request.Request(url, headers={
                  'Authorization': f'Bearer {key}',
                  'Accept': 'application/json',
                  'User-Agent': 'render-metrics-diagnostics/1.0',
              })
              try:
                  with urllib.request.urlopen(req, timeout=25) as response:
                      status = response.status
                      raw = response.read(2_000_000)
                  try:
                      data = json.loads(raw)
                      shape = f'JSON {type(data).__name__}'
                      if isinstance(data, list):
                          shape += f', entries={len(data)}'
                      elif isinstance(data, dict):
                          shape += ', keys=' + ','.join(list(data.keys())[:10])
                      result = 'PASS'
                  except (ValueError, UnicodeDecodeError):
                      shape = 'non-JSON response'
                      result = 'ERROR'
              except urllib.error.HTTPError as exc:
                  status, shape, result = exc.code, 'HTTP error; body hidden', 'UNAVAILABLE' if exc.code in (401, 403, 404) else 'ERROR'
              except Exception as exc:
                  status, shape, result = '-', type(exc).__name__, 'ERROR'
              print(f'{label}: {result} | HTTP {status} | {shape}')
              results.append((label, result))
          if results[0][1] != 'PASS':
              print('::error::Service lookup failed. Verify service ID and API access.')
              raise SystemExit(1)
          print('Diagnostics finished. Metric UNAVAILABLE/ERROR results do not fail this discovery workflow.')
          PY
