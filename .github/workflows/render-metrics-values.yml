name: Render Metrics Values Inspection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
    steps:
      - name: Inspect numeric metrics safely (read only)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RENDER_API_KEY:-}" ]]; then
            echo '::error::Missing secret RENDER_API_KEY'; exit 1
          fi
          if [[ ! "${RENDER_SERVICE_ID:-}" =~ ^srv-[a-zA-Z0-9]+$ ]]; then
            echo '::error::Missing or invalid variable RENDER_SERVICE_ID'; exit 1
          fi
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          now = dt.datetime.now(dt.timezone.utc)
          start = now - dt.timedelta(hours=24)
          params = urllib.parse.urlencode({
              'resource': os.environ['RENDER_SERVICE_ID'],
              'startTime': start.strftime('%Y-%m-%dT%H:%M:%SZ'),
              'endTime': now.strftime('%Y-%m-%dT%H:%M:%SZ'),
          })
          endpoints = {
              'Bandwidth': 'bandwidth',
              'CPU': 'cpu',
              'Memory': 'memory',
              'Instance Count': 'instance-count',
          }
          print('Taiwan check time:', (now + dt.timedelta(hours=8)).strftime('%Y-%m-%d %H:%M:%S'))
          print('Time range:', start.isoformat(), 'to', now.isoformat())
          print('Inspecting JSON shapes and numeric/time samples only; no full API response bodies.')

          def shape(value):
              if isinstance(value, dict):
                  return 'object keys=' + ', '.join(sorted(str(k) for k in value.keys())[:20])
              if isinstance(value, list):
                  return f'array[{len(value)}]'
              return type(value).__name__

          def safe_fields(obj, prefix='', depth=0):
              """Print only numeric values and time-like strings, never arbitrary text fields."""
              if depth > 5:
                  return []
              out = []
              if isinstance(obj, dict):
                  for key, val in list(obj.items())[:30]:
                      path = f'{prefix}.{key}' if prefix else str(key)
                      if isinstance(val, bool):
                          continue
                      if isinstance(val, (int, float)):
                          out.append(f'{path}={val}')
                      elif isinstance(val, str) and any(x in str(key).lower() for x in ('time', 'date', 'timestamp')):
                          out.append(f'{path}={val[:48]}')
                      elif isinstance(val, (dict, list)):
                          out.extend(safe_fields(val, path, depth + 1))
              elif isinstance(obj, list):
                  for i, val in enumerate(obj[:2]):
                      out.extend(safe_fields(val, f'{prefix}[{i}]', depth + 1))
              return out[:35]

          for label, endpoint in endpoints.items():
              url = f'https://api.render.com/v1/metrics/{endpoint}?{params}'
              request = urllib.request.Request(url, headers={
                  'Authorization': 'Bearer ' + os.environ['RENDER_API_KEY'],
                  'Accept': 'application/json',
                  'User-Agent': 'render-metrics-values-inspection/1.0',
              })
              print(f'\n=== {label} ===')
              try:
                  with urllib.request.urlopen(request, timeout=25) as response:
                      payload = json.load(response)
                      print('HTTP:', response.status)
              except urllib.error.HTTPError as exc:
                  print('HTTP:', exc.code, '| API error (body hidden)')
                  continue
              except Exception as exc:
                  print('ERROR:', type(exc).__name__)
                  continue
              print('Root:', shape(payload))
              if isinstance(payload, list):
                  if not payload:
                      print('NO DATA: N/A (not zero)')
                      continue
                  samples = [('first', payload[0])]
                  if len(payload) > 1:
                      samples.append(('last', payload[-1]))
              else:
                  samples = [('root', payload)]
              for tag, sample in samples:
                  print(f'{tag} item:', shape(sample))
                  fields = safe_fields(sample)
                  if fields:
                      for field in fields:
                          print('  ', field)
                  else:
                      print('  No numeric or time-like fields found in sample.')
          print('\nInspection complete. No data was written.')
          PY
