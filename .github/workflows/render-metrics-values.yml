name: Render Metrics Units Inspection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
    steps:
      - name: Inspect numeric metrics safely (read only)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RENDER_API_KEY:-}" ]]; then
            echo '::error::Missing secret RENDER_API_KEY'; exit 1
          fi
          if [[ ! "${RENDER_SERVICE_ID:-}" =~ ^srv-[a-zA-Z0-9]+$ ]]; then
            echo '::error::Missing or invalid variable RENDER_SERVICE_ID'; exit 1
          fi
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          now = dt.datetime.now(dt.timezone.utc)
          start = now - dt.timedelta(hours=24)
          params = urllib.parse.urlencode({
              'resource': os.environ['RENDER_SERVICE_ID'],
              'startTime': start.strftime('%Y-%m-%dT%H:%M:%SZ'),
              'endTime': now.strftime('%Y-%m-%dT%H:%M:%SZ'),
          })
          endpoints = {
              'Bandwidth': 'bandwidth',
              'CPU': 'cpu',
              'Memory': 'memory',
              'Instance Count': 'instance-count',
          }
          print('Taiwan check time:', (now + dt.timedelta(hours=8)).strftime('%Y-%m-%d %H:%M:%S'))
          print('Time range:', start.isoformat(), 'to', now.isoformat())
          print('Inspecting unit, label keys, and point counts; no full API response bodies.')

          def shape(value):
              if isinstance(value, dict):
                  return 'object keys=' + ', '.join(sorted(str(k) for k in value.keys())[:20])
              if isinstance(value, list):
                  return f'array[{len(value)}]'
              return type(value).__name__

          def safe_scalar(value):
              """Limit displayed API metadata to short printable scalars."""
              if value is None or isinstance(value, (bool, int, float)):
                  return repr(value)
              if isinstance(value, str):
                  return repr(''.join(ch for ch in value if ch.isprintable())[:80])
              return '<non-scalar>'

          def inspect_series(item, tag):
              if not isinstance(item, dict):
                  print(f'  {tag}: unexpected item type={type(item).__name__}')
                  return
              print(f'  {tag} unit:', safe_scalar(item.get('unit')))
              labels = item.get('labels')
              if isinstance(labels, dict):
                  print(f'  {tag} label keys:', ', '.join(sorted(map(str, labels.keys()))) or '(none)')
                  for key, value in list(sorted(labels.items(), key=lambda pair: str(pair[0])))[:10]:
                      print(f'    {str(key)[:50]}:', safe_scalar(value))
              else:
                  print(f'  {tag} labels type:', type(labels).__name__)
              values = item.get('values')
              print(f'  {tag} measurement points:', len(values) if isinstance(values, list) else 'N/A')
              if isinstance(values, list) and values:
                  point = values[0]
                  if isinstance(point, dict):
                      print(f'  {tag} first point keys:', ', '.join(sorted(map(str, point.keys()))))

          for label, endpoint in endpoints.items():
              url = f'https://api.render.com/v1/metrics/{endpoint}?{params}'
              request = urllib.request.Request(url, headers={
                  'Authorization': 'Bearer ' + os.environ['RENDER_API_KEY'],
                  'Accept': 'application/json',
                  'User-Agent': 'render-metrics-values-inspection/1.0',
              })
              print(f'\n=== {label} ===')
              try:
                  with urllib.request.urlopen(request, timeout=25) as response:
                      payload = json.load(response)
                      print('HTTP:', response.status)
              except urllib.error.HTTPError as exc:
                  print('HTTP:', exc.code, '| API error (body hidden)')
                  continue
              except Exception as exc:
                  print('ERROR:', type(exc).__name__)
                  continue
              print('Root:', shape(payload))
              if isinstance(payload, list):
                  if not payload:
                      print('NO DATA: N/A (not zero)')
                      continue
                  samples = [('first', payload[0])]
                  if len(payload) > 1:
                      samples.append(('last', payload[-1]))
              else:
                  samples = [('root', payload)]
              total_points = sum(len(item.get('values', [])) for item in payload
                                 if isinstance(item, dict) and isinstance(item.get('values'), list)) if isinstance(payload, list) else 'N/A'
              print('Total measurement points across series:', total_points)
              for tag, sample in samples:
                  inspect_series(sample, tag)
          print('\nInspection complete. No data was written.')
          PY
