                  elif metrics.get('HTTP_STATUS') != '200':
                      error = f"Unexpected HTTP status {metrics.get('HTTP_STATUS', 'unknown')} (expected 200)"
                  else:
                      try:
                          with open(f.name, encoding='utf-8') as response:
                              body = json.load(response)
                          if isinstance(body, dict) and body.get('status') == 'ok':
                              status = 'PASS'
                          else:
                              error = 'Health JSON did not contain status=ok'
                      except (ValueError, UnicodeError) as exc:
                          error = f'Invalid JSON response ({type(exc).__name__})'
              except subprocess.TimeoutExpired:
                  error = 'Health request exceeded 190-second process timeout'

          def numeric(key):
              try:
                  return float(metrics[key]) if key in metrics else None
              except ValueError:
                  return None

          http = metrics.get('HTTP_STATUS', '')
          http_status = int(http) if http.isdigit() and int(http) > 0 else None
          print('Health status:', status)
          for key in ('HTTP_STATUS', 'DNS_SECONDS', 'CONNECT_SECONDS', 'TLS_SECONDS', 'TTFB_SECONDS', 'TOTAL_SECONDS'):
              print(f'{key}={metrics.get(key, "N/A")}')
          if error:
              print('Reason:', error)

          try:
              with psycopg.connect(database_url, connect_timeout=15) as conn:
                  with conn.cursor() as cur:
                      cur.execute('''INSERT INTO health_checks
                          (checked_at, status, http_status, dns_seconds, connect_seconds,
                           tls_seconds, ttfb_seconds, total_seconds, error_message)
                          VALUES (%s, %s, %s, %s, %s, %s, %s, %s, %s)''',
                          (started, status, http_status, numeric('DNS_SECONDS'),
                           numeric('CONNECT_SECONDS'), numeric('TLS_SECONDS'),
                           numeric('TTFB_SECONDS'), numeric('TOTAL_SECONDS'), error))
              print('Database write: PASS')
          except Exception as exc:
              # Avoid printing exception details: connection errors may contain credentials.
              print(f'::error::Database write failed ({type(exc).__name__}); inspect Neon connectivity and schema.')
              sys.exit(1)

          if status != 'PASS':
              print(f'::error::Health check failed: {error}')
              sys.exit(1)
          print('Health check passed.')
          PY

